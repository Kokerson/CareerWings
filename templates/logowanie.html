<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zaloguj się</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Zaloguj się do aplikacji</h1>
        <form action="/logowanie" method="POST">
            <input type="text" name="nazwa_uzytkownika" placeholder="Nazwa użytkownika" required>
            <input type="password" name="haslo" placeholder="Hasło" required>
            <button type="submit">Zaloguj się</button>
        </form>

        {% if blad %}<p class="answer-box"><strong>Błąd:</strong> {{ blad }}</p>{% endif %}
        <p><a href="/rejestracja">Nie masz konta? Zarejestruj się</a></p>
    </main>
</body>
</html>
