<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mój Chatbot AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Zapytaj AI</h1>
        <form action="/zapytaj" method="POST">
            <textarea name="pytanie" id="pytanie" rows="4" placeholder="Wpisz swoje pytanie..."></textarea>
            <button type="submit">Wyślij</button>
        </form>
        <div class="answer-box">
            {% if odpowiedz %}
                <p>{{ odpowiedz }}</p>
            {% else %}
                <p>Tutaj pojawi się odpowiedź AI.</p>
            {% endif %}
        </div>
    </main>
</body>
</html>
